name: MangoQA quality
# Audit dormant 2026-09-30 (#35) : la suite de tests MangoQA (vitest, 12 fichiers) n'était lancée que par CI de
# MangoOS, et sur une révision figée — une régression du Disjoncteur pouvait rester invisible. Ici elle tourne
# à chaque push/PR de MangoQA lui-même. (test:manual reste hors CI : il dépend d'un Ollama.)
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  quality:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - run: npm ci
      - run: npm run typecheck && npm test
